    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Personal Profile Card</title>

        <link rel="stylesheet" href="css/master1.css">
    </head>

    <body>

        <main>

            <div class="card">

                <!-- Profile Image -->
                <div class="card-header">
                    <img src="images/ahmed.jpg" alt="Ahmed Sabry">
                </div>

                <!-- Profile Information -->
                <div class="card-body">

                    <h1>Ahmed Sabry</h1>

                    <p class="job-title">Front-End Developer</p>

                    <p class="description">
                        Passionate about building modern and responsive websites.
                    </p>

                    <!-- Social Media Links -->
                    <ul class="social-links">
                        <li>
                            <a href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener noreferrer">
                                Facebook
                            </a>
                        </li>

                        <li>
                            <a href="https://www.linkedin.com/"
                            target="_blank"
                            rel="noopener noreferrer">
                                LinkedIn
                            </a>
                        </li>
                    </ul>

                </div>

                <!-- Contact Button -->
                <div class="card-footer">
                    <button class="btn" type="button">
                        Contact Me
                    </button>
                </div>

            </div>

        </main>

    </body>
    </html>
